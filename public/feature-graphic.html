<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');

        body {
            width: 1024px;
            height: 500px;
            overflow: hidden;
            background: linear-gradient(135deg, #181A20 0%, #1F222A 60%, #252830 100%);
            font-family: Inter, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Subtle fork/plate decorations */
        .deco {
            position: absolute;
            opacity: 0.06;
            font-size: 120px;
            color: white;
        }

        .deco-1 {
            top: 20px;
            left: 30px;
            transform: rotate(-15deg);
        }

        .deco-2 {
            bottom: 20px;
            right: 40px;
            transform: rotate(10deg);
        }

        .deco-3 {
            top: 30px;
            right: 120px;
            font-size: 80px;
            transform: rotate(25deg);
        }

        .deco-4 {
            bottom: 40px;
            left: 150px;
            font-size: 90px;
            transform: rotate(-20deg);
        }

        .content {
            display: flex;
            align-items: center;
            gap: 40px;
            z-index: 1;
        }

        .logo-wrap {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4d67 0%, #e53e58 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(255, 77, 103, 0.4);
            flex-shrink: 0;
        }

        .logo-wrap img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        .text h1 {
            font-size: 72px;
            font-weight: 800;
            color: white;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .text p {
            font-size: 24px;
            color: #9e9e9e;
            font-weight: 400;
        }

        .accent-line {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff4d67 0%, #fb9400 100%);
        }
    </style>
</head>

<body>
    <div class="deco deco-1">🍴</div>
    <div class="deco deco-2">🍽️</div>
    <div class="deco deco-3">🥄</div>
    <div class="deco deco-4">🍳</div>
    <div class="content">
        <div class="logo-wrap">
            <img src="/images/logo.png" alt="FeedYum">
        </div>
        <div class="text">
            <h1>FeedYum</h1>
            <p>Discover. Order. Share your food journey.</p>
        </div>
    </div>
    <div class="accent-line"></div>
</body>

</html>
